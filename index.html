<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>strawberry</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="frames.css">
    <link rel="stylesheet" href="leds.css">
    <link rel="stylesheet" href="dev.css">
    <link rel="stylesheet" href="controls.css">
    <link rel="stylesheet" href="error.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <page>
        <framesPanel>
            <frames id="frames">
            </frames>
            <button id="addFrame" onclick="project.addFrame()"><img class="icon" src="icons/add.svg"></button>
        </framesPanel>
        <leds id="leds"></leds>
        <controls>
            <canvas id="picker"></canvas>
            <div id="selectedColor"></div>
            <buttonGroup>
                <button onclick="serial.connect()" id="connectBtn">connect</button>
                <button id="flash">flash</button>
            </buttonGroup>
            <buttonGroup>
                <div class="iconContainer" data-name="save"><img class="icon" src="icons/save.svg"></div>
                <div class="iconContainer" data-name="open"><img class="icon" src="icons/open.svg"></div>
            </buttonGroup>
            <div id="devTools" data-name="dev tools" class="iconContainer">
                <img src="icons/dev.svg" class="icon">
                <div>
                    <div class="iconContainer" onclick="document.querySelector('payloadMonitor').classList.toggle('show')" data-name="payload monitor">
                        <img src="icons/payloadMonitor.svg" class="icon">
                    </div>
                    <div class="iconContainer" onclick="document.querySelector('hexMonitor').classList.toggle('show')" data-name="hex monitor">
                        <img src="icons/binary.svg" class="icon">
                    </div>
                </div>
            </div>
        </controls>
    </page>
    <hexMonitor class="window" style="top:100px;left:200px">
        <div class="window-handle">
            <div>
                <input type="text" placeholder="hex" id="hm-hex" onfocus="this.value = ''" oninput="document.getElementById('hm-int').value = parseInt(this.value, 16)">
                <input type="text" placeholder="int" id="hm-int" onfocus="this.value = ''" oninput="document.getElementById('hm-hex').value = parseInt(this.value).toString(16)">
            </div>
            <div>
                <button onclick="serial.clearHistory()">clear</button>
                <button onclick="serial.resetDevice()">reset device</button>
                <button onclick="serial.connect()">connect</button>
                <input type="text" id="inpt" placeholder="send to device">
                <button onclick="serial.send(document.getElementById('inpt').value);document.getElementById('inpt').value = ''">send</button>
            </div>
        </div>
        <div id="hexMonitor-content"></div>
    </hexMonitor>
    <payloadMonitor class="window" style="top: 100px; left: 100px;">
        <div class="window-handle">
            <select id="pm-operation" onchange="payloads.updatePMInputs(this.value)"></select>
            <input type="text" id="pm-args" placeholder="args"><br>
            <textarea id="pm-otherData" onmousemove="event.stopPropagation()"></textarea>
            <button onclick="payloads.runPMInputs()">run</button>
        </div>
        <div id="payloadMonitor-content"></div>
    </payloadMonitor>
    <errorPopup hidden>
        <text class="title">Error</text>
    </errorPopup>
    <script src="config.js"></script>
    <script src="scripts.js"></script>
    <script src="animations.js"></script>
    <script src="leds.js"></script>
    <script src="serial.js"></script>
    <script src="payloads.js"></script>
</body>
</html>
