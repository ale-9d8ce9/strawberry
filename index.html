<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>strawberry</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="hexMonitor.css">
    <link rel="stylesheet" href="leds.css">
    <link rel="stylesheet" href="error.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <page>
        <leds id="leds"></leds>
        <canvas id="picker">
    </page>
    <hexMonitor>
        <div>
            <div>
                <input type="text" placeholder="hex" id="hm-hex" onfocus="this.value = ''" oninput="document.getElementById('hm-int').value = parseInt(this.value, 16)">
                <input type="text" placeholder="int" id="hm-int" onfocus="this.value = ''" oninput="document.getElementById('hm-hex').value = parseInt(this.value).toString(16)">
            </div>
            <div>
                <button onclick="serial.clearHistory()">clear</button>
                <button onclick="serial.resetDevice()">reset device</button>
                <button onclick="serial.connect()">connect</button>
                <input type="text" id="inpt" placeholder="send to device">
                <button onclick="serial.send(document.getElementById('inpt').value);document.getElementById('inpt').value = ''">send</button>
            </div>
        </div>
        <div id="hexMonitor-content"></div>
    </hexMonitor>
    <errorPopup>
        <text class="title">Error</text>
    </errorPopup>
    <script>

    </script>
    <script src="config.js"></script>
    <script src="scripts.js"></script>
    <script src="leds.js"></script>
    <script src="serial.js"></script>
    <script src="payloads.js"></script>
</body>
</html>
